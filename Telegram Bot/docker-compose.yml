version: '3.8'

services:
  springbot:
    build: .
    container_name: springbot
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mydb?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Qwertu321!
    restart: always

  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Qwertu321!
      MYSQL_DATABASE: tg-bot
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  mysql_data:
